name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: aws-rds-snapshot-prune
    steps:
      - uses: actions/checkout@v4

      # setup-go pulls the official .tar.gz (not .tar.xz), so it works on the
      # minimal self-hosted ARC runner.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Demo (offline)
        run: go run ./examples/demo
